name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test ./...

      - name: Build CLI
        run: go build ./cmd/apidetect

      - name: Build GUI launcher
        if: runner.os != 'Windows'
        run: go build ./cmd/apidetect-gui

      - name: Build GUI launcher (Windows GUI subsystem)
        if: runner.os == 'Windows'
        run: go build -ldflags "-H=windowsgui" ./cmd/apidetect-gui

      - name: Smoke test providers command
        run: go run ./cmd/apidetect providers
