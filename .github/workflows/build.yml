name: Build

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build
        run: dotnet publish src/ApiDetector.csproj -c Release -r win-x64 -o . --self-contained true

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ApiDetector.exe ApiDetector.pdb av_libglesv2.dll libHarfBuzzSharp.dll libSkiaSharp.dll
          git diff --staged --quiet || git commit -m "chore: 自动更新编译产物"
          git push
