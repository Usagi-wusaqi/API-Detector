<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>API Detector GUI</title>
    <link rel="stylesheet" href="/assets/app.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="hero">
        <div>
          <p class="eyebrow">Local Desktop GUI</p>
          <h1>API Detector</h1>
          <p class="subhead">本地桌面界面，直接复用当前 Go 检测内核。</p>
        </div>
        <div class="hero-meta">
          <div class="badge">v3.0.0</div>
          <div id="status-pill" class="status-pill idle">就绪</div>
        </div>
      </header>

      <main class="layout">
        <section class="panel config-panel">
          <div class="panel-header">
            <h2>检测配置</h2>
            <div class="actions">
              <button id="import-file" class="ghost">导入文件</button>
              <input id="file-input" type="file" accept=".txt,.log,.key" hidden />
            </div>
          </div>

          <div class="grid-two">
            <label>
              <span>Provider</span>
              <select id="provider"></select>
            </label>
            <label>
              <span>并发数</span>
              <input id="concurrency" type="number" min="1" value="100" />
            </label>
            <label>
              <span>超时</span>
              <input id="timeout" type="text" value="10s" />
            </label>
            <label>
              <span>输出格式</span>
              <select id="format">
                <option value="text">text</option>
                <option value="json">json</option>
              </select>
            </label>
            <label>
              <span>代理模式</span>
              <select id="proxy-mode">
                <option value="env">跟随环境 (env)</option>
                <option value="direct">直连 (direct)</option>
                <option value="custom">自定义 (custom)</option>
              </select>
            </label>
            <label id="proxy-url-wrap">
              <span>代理地址</span>
              <input id="proxy-url" type="text" placeholder="http://127.0.0.1:7890" />
            </label>
          </div>

          <div id="custom-panel" class="custom-panel">
            <div class="custom-header">
              <h3>自定义 Provider</h3>
              <p>当 Provider 选择为 <code>custom</code> 时生效。</p>
            </div>
            <div class="grid-two">
              <label>
                <span>URL</span>
                <input id="custom-url" type="text" placeholder="https://example.com/check?key={key}" />
              </label>
              <label>
                <span>Method</span>
                <input id="custom-method" type="text" value="GET" />
              </label>
              <label>
                <span>Auth Mode</span>
                <select id="custom-auth-mode">
                  <option value="bearer">Bearer (bearer)</option>
                  <option value="none">无认证 (none)</option>
                </select>
              </label>
              <label>
                <span>附加请求头</span>
                <textarea id="custom-headers" rows="4" placeholder="x-api-key: {key}"></textarea>
              </label>
            </div>
            <label>
              <span>请求体</span>
              <textarea id="custom-body" rows="5" placeholder='{"key":"{key}"}'></textarea>
            </label>
          </div>

          <label class="keys-block">
            <span>Keys</span>
            <textarea id="keys" rows="14" placeholder="每行一个 key"></textarea>
          </label>

          <div class="button-row">
            <button id="start" class="primary">开始检测</button>
            <button id="cancel" class="ghost" disabled>取消</button>
            <button id="export-report" class="ghost" disabled>导出报告</button>
            <button id="export-valid" class="ghost" disabled>导出有效</button>
            <button id="export-invalid" class="ghost" disabled>导出无效</button>
            <button id="export-error" class="ghost" disabled>导出错误</button>
          </div>
        </section>

        <section class="panel results-panel">
          <div class="panel-header">
            <h2>检测结果</h2>
            <div class="summary-inline">
              <span id="summary-rate">0.00 keys/s</span>
            </div>
          </div>

          <div class="history-panel">
            <div class="history-header">
              <h3>最近任务</h3>
              <button id="refresh-history" class="ghost small">刷新</button>
            </div>
            <div id="job-history" class="job-history empty">暂无任务</div>
          </div>

          <div class="stats-grid">
            <div class="stat-card"><span>总计</span><strong id="stat-total">0</strong></div>
            <div class="stat-card"><span>有效</span><strong id="stat-valid">0</strong></div>
            <div class="stat-card"><span>无效</span><strong id="stat-invalid">0</strong></div>
            <div class="stat-card"><span>错误</span><strong id="stat-error">0</strong></div>
          </div>

          <div class="progress-wrap">
            <div class="progress-bar"><div id="progress-fill"></div></div>
            <span id="progress-text">0 / 0</span>
          </div>

          <div class="filters">
            <label>
              <span>状态筛选</span>
              <select id="status-filter">
                <option value="all">全部</option>
                <option value="valid">有效</option>
                <option value="invalid">无效</option>
                <option value="error">错误</option>
                <option value="canceled">取消</option>
              </select>
            </label>
            <label>
              <span>排序</span>
              <select id="sort-order">
                <option value="index">按输入顺序</option>
                <option value="latency_desc">按延迟降序</option>
                <option value="latency_asc">按延迟升序</option>
              </select>
            </label>
            <label class="search-field">
              <span>搜索</span>
              <input id="search-query" type="text" placeholder="搜索 masked key / 状态 / 原因 / 消息" />
            </label>
          </div>

          <div class="results-table-wrap">
            <table class="results-table">
              <thead>
                <tr>
                  <th>状态</th>
                  <th>Key</th>
                  <th>说明</th>
                  <th>HTTP</th>
                  <th>延迟</th>
                </tr>
              </thead>
              <tbody id="results-body"></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>

    <script src="/assets/app.js" defer></script>
  </body>
  </html>
