<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>API Detector GUI</title>
    <link rel="stylesheet" href="/assets/app.css" />
  </head>
  <body>
    <div class="page-shell">
      <main class="layout">
        <section class="panel config-panel">
          <div class="app-intro">
            <div class="app-intro-head">
              <div>
                <p class="eyebrow">Local Desktop GUI</p>
                <h1>API Detector</h1>
                <p class="subhead">本地桌面界面，直接复用当前 Go 检测内核。</p>
              </div>
              <div class="hero-meta">
                <div id="version-badge" class="badge">v3.0.0</div>
                <div id="status-pill" class="status-pill idle">就绪</div>
              </div>
            </div>
            <div id="banner" class="banner hidden"></div>
          </div>

          <div class="panel-header">
            <h2>检测配置</h2>
            <div class="actions">
              <button id="import-file" class="ghost">导入文件</button>
              <button id="reset-settings" class="ghost">重置设置</button>
              <input id="file-input" type="file" accept=".txt,.log,.key" hidden />
            </div>
          </div>

          <div class="grid-two">
            <label>
              <span class="field-title">供应商 (Provider)</span>
              <select id="provider"></select>
            </label>
            <label>
              <span class="field-title with-action">
                <span>接口地址 (Endpoint URL)</span>
                <button id="provider-advanced-trigger" class="ghost tiny" type="button">高级设置</button>
              </span>
              <input id="endpoint-url" type="text" />
            </label>
            <label>
              <span class="field-title">超时 (Timeout)</span>
              <div class="spinbox">
                <input id="timeout" type="text" value="10s" />
                <div class="spinbox-controls">
                  <button class="spinbox-button" type="button" data-target="timeout" data-direction="up" aria-label="增加超时"></button>
                  <button class="spinbox-button" type="button" data-target="timeout" data-direction="down" aria-label="减少超时"></button>
                </div>
              </div>
            </label>
            <label>
              <span class="field-title with-action">
                <span>代理模式 (Proxy Mode)</span>
                <button id="proxy-advanced-trigger" class="ghost tiny" type="button">高级设置</button>
              </span>
              <select id="proxy-mode">
                <option value="env">跟随环境 (env)</option>
                <option value="direct">直连 (direct)</option>
                <option value="custom">自定义 (custom)</option>
              </select>
            </label>
            <label>
              <span class="field-title">并发数 (Concurrency)</span>
              <div class="spinbox">
                <input id="concurrency" type="number" min="1" step="1" value="100" />
                <div class="spinbox-controls">
                  <button class="spinbox-button" type="button" data-target="concurrency" data-direction="up" aria-label="增加并发数"></button>
                  <button class="spinbox-button" type="button" data-target="concurrency" data-direction="down" aria-label="减少并发数"></button>
                </div>
              </div>
            </label>
            <label>
              <span class="field-title with-action">
                <span>输出格式 (Output Format)</span>
                <button id="format-advanced-trigger" class="ghost tiny" type="button">高级设置</button>
              </span>
              <select id="format">
                <option value="text">文本 (text)</option>
                <option value="json">JSON (json)</option>
                <option value="custom">自定义 (custom)</option>
              </select>
            </label>
          </div>

          <div id="format-advanced-drawer" class="advanced-drawer hidden" role="dialog" aria-modal="true" aria-labelledby="format-advanced-title">
            <div class="advanced-dialog advanced-dialog-sm">
              <div class="advanced-dialog-header">
                <h3 id="format-advanced-title">输出格式高级设置</h3>
                <button id="format-advanced-close" class="ghost tiny" type="button">关闭</button>
              </div>
              <p id="format-advanced-note" class="advanced-hint"></p>
              <div class="advanced-grid">
                <label>
                  <span>文件尾缀 (可选)</span>
                  <input id="format-suffix" type="text" placeholder="例如 log 或 json" />
                </label>
              </div>
            </div>
          </div>

          <div id="proxy-advanced-drawer" class="advanced-drawer hidden" role="dialog" aria-modal="true" aria-labelledby="proxy-advanced-title">
            <div class="advanced-dialog advanced-dialog-sm">
              <div class="advanced-dialog-header">
                <h3 id="proxy-advanced-title">代理高级设置</h3>
                <button id="proxy-advanced-close" class="ghost tiny" type="button">关闭</button>
              </div>
              <p id="proxy-mode-note" class="advanced-hint"></p>
              <div class="advanced-grid">
                <label id="proxy-url-wrap">
                  <span>代理地址 (Proxy URL)</span>
                  <input id="proxy-url" type="text" placeholder="http://127.0.0.1:8080" />
                </label>
              </div>
            </div>
          </div>

          <div id="provider-advanced-drawer" class="advanced-drawer hidden" role="dialog" aria-modal="true" aria-labelledby="provider-advanced-title">
            <div class="advanced-dialog">
              <div class="advanced-dialog-header">
                <h3 id="provider-advanced-title">自定义供应商高级设置</h3>
                <button id="provider-advanced-close" class="ghost tiny" type="button">关闭</button>
              </div>
              <p id="provider-advanced-note" class="advanced-hint">以下设置均为可选，不填将使用默认请求行为。</p>
              <div class="advanced-grid">
                <label id="custom-method-wrap">
                  <span>请求方法 (Method，可选)</span>
                  <input id="custom-method" type="text" value="GET" placeholder="默认 GET，可改 POST" />
                </label>
                <label id="custom-auth-wrap">
                  <span>认证方式 (Auth Mode，可选)</span>
                  <select id="custom-auth-mode">
                    <option value="bearer">Bearer（自动加 Authorization）</option>
                    <option value="none">无认证（不加认证头）</option>
                  </select>
                </label>
                <label id="custom-headers-wrap" class="span-2">
                  <span>附加请求头 (Headers，可选)</span>
                  <textarea id="custom-headers" rows="4" placeholder="每行一个请求头，格式 Header: Value"></textarea>
                </label>
                <label id="custom-body-wrap" class="span-2">
                  <span>请求体 (Body，可选)</span>
                  <textarea id="custom-body" rows="5" placeholder="可选，填写 JSON 请求体"></textarea>
                </label>
              </div>
            </div>
          </div>

          <label class="keys-block">
            <span>Keys</span>
            <textarea id="keys" rows="13" placeholder="每行一个 key"></textarea>
          </label>

          <div class="button-row">
            <button id="start" class="primary">开始检测</button>
            <button id="cancel" class="ghost" disabled>取消</button>
            <button id="export-report" class="ghost" disabled>导出报告</button>
            <button id="export-valid" class="ghost" disabled>导出有效</button>
            <button id="export-invalid" class="ghost" disabled>导出无效</button>
            <button id="export-error" class="ghost" disabled>导出错误</button>
          </div>

          <div class="history-panel side-history">
            <div class="history-header">
              <h3>最近任务 <span id="history-count" class="history-count">0</span></h3>
              <div class="actions">
                <button id="refresh-history" class="ghost small">刷新</button>
                <button id="clear-history" class="ghost small">清空历史</button>
                <button id="toggle-history" class="ghost small">展开</button>
              </div>
            </div>
            <div id="job-history" class="job-history empty">暂无任务</div>
          </div>
        </section>

        <section class="panel results-panel">
          <div class="panel-header">
            <h2>检测结果</h2>
            <div class="summary-inline">
              <span id="summary-rate">0.00 keys/s</span>
            </div>
          </div>

          <div class="stats-grid">
            <div class="stat-card"><span>总计</span><strong id="stat-total">0</strong></div>
            <div class="stat-card"><span>有效</span><strong id="stat-valid">0</strong></div>
            <div class="stat-card"><span>无效</span><strong id="stat-invalid">0</strong></div>
            <div class="stat-card"><span>错误</span><strong id="stat-error">0</strong></div>
          </div>

          <div class="progress-wrap">
            <div class="progress-bar"><div id="progress-fill"></div></div>
            <span id="progress-text">0 / 0</span>
          </div>

          <div class="filters">
            <label>
              <span>状态筛选</span>
              <select id="status-filter">
                <option value="all">全部</option>
                <option value="valid">有效</option>
                <option value="invalid">无效</option>
                <option value="error">错误</option>
                <option value="canceled">取消</option>
              </select>
            </label>
            <label>
              <span>排序</span>
              <select id="sort-order">
                <option value="index">按输入顺序</option>
                <option value="latency_desc">按延迟降序</option>
                <option value="latency_asc">按延迟升序</option>
              </select>
            </label>
            <label class="search-field">
              <span>搜索</span>
              <input id="search-query" type="text" placeholder="搜索 序号 / 状态 / Key / 说明 / HTTP / 延迟" />
            </label>
          </div>

          <div class="pagination">
            <label class="page-size-field">
              <span>每页</span>
              <select id="page-size">
                <option value="20">20</option>
                <option value="50" selected>50</option>
                <option value="100">100</option>
                <option value="200">200</option>
              </select>
            </label>
            <div class="pagination-actions">
              <button id="page-prev" class="ghost small">上一页</button>
              <span id="page-info">第 1 / 1 页</span>
              <button id="page-next" class="ghost small">下一页</button>
            </div>
          </div>

          <div class="results-table-wrap">
            <table class="results-table">
              <thead>
                <tr>
                  <th>序号</th>
                  <th>状态</th>
                  <th>Key</th>
                  <th>说明</th>
                  <th>HTTP</th>
                  <th>延迟</th>
                </tr>
              </thead>
              <tbody id="results-body"></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>

    <script src="/assets/app.js" defer></script>
  </body>
  </html>
